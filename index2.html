<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuvi Conecta – Iniciar sesión</title>

<!-- Tipografía (Google Fonts). Si quieres probar otra, cámbiala aquí y en --fuente (más abajo).
     Opciones parecidas: Roboto, Hind, Barlow, Exo 2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  /* ===== Variables: aquí cambias colores y tipografía de toda la página ===== */
  :root {
    --fuente: 'Titillium Web', 'Segoe UI', system-ui, sans-serif;
    --amarillo: #FFF0B9;   /* fondo de la portada */
    --naranja: #FF821D;    /* botón principal */
    --texto: #22242C;
    --enlace: #B5491F;
    --logo: #CC2530;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #F2EEE3;            /* fondo que se ve en PC alrededor del "móvil" */
    font-family: var(--fuente);
    color: var(--texto);
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ===== Contenedor de la app =====
     En móvil ocupa toda la pantalla; en PC se centra como un móvil. */
  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    background: #fff;
    overflow: hidden;
  }
  @media (min-width: 560px) {
    .app {
      min-height: 0;
      height: 839px;
      margin: 24px auto;
      border-radius: 28px;
      box-shadow: 0 12px 48px rgba(60, 50, 20, 0.18);
    }
  }
  .pantalla { position: relative; display: flex; flex-direction: column; flex: 1 0 auto; }

  /* ===== Chip "Oficina" (lo usan las dos pantallas) ===== */
  .chip {
    position: absolute; right: 0;
    display: flex; align-items: center;
    height: 44px; padding: 0; margin: 0; border: 0; background: none; color: var(--texto);
  }
  .chip span.pildora {
    display: flex; align-items: center; gap: 11px;
    height: 28px; padding: 0 17px 0 12px;
    border-radius: 14px 0 0 14px;
    background: #EBEEF5;
    font-size: 14px; line-height: 1;
  }

  /* ===================== PANTALLA 1: PORTADA ===================== */
  .portada { position: relative; flex: 1 0 624px; background: var(--amarillo); }

  .logo { position: absolute; left: 24px; top: 68px; height: 24px; display: flex; align-items: center; }
  .logo svg { display: block; width: 150px; height: auto; }

  .portada .chip { top: 57px; }

  .portada h1 {
    position: absolute; z-index: 1; left: 24px; top: 165px; margin: 0;
    font-size: 23px; line-height: 27px; font-weight: 400;
  }
  .foto {
    position: absolute; right: 0; bottom: 0;
    width: 298px; height: 337px; display: block;
  }

  .acciones {
    flex: none; display: flex; flex-direction: column; align-items: center;
    padding: 22px 24px 42px;
  }
  .btn-principal {
    width: 100%; max-width: 312px; height: 43px;
    border: 0; border-radius: 22px;
    background: var(--naranja); color: #3A2E28;
    font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .btn-vip {
    margin-top: 12px; height: 44px; padding: 0 12px;
    border: 0; background: none; color: #26262A;
    font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .legal {
    margin: 14px 0 0; text-align: center;
    font-size: 12px; line-height: 19px; color: #1C1C1C;
    text-wrap: balance;
  }
  .legal a { color: var(--enlace); }
  .legal a:hover { color: #8A3412; }

  /* ===================== PANTALLA 2: LOGIN ===================== */
  .login { min-height: 600px; }

  .btn-volver {
    position: absolute; left: 13px; top: 52px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border: 0; background: none;
  }
  .login .titulo-seccion {
    position: absolute; left: 0; right: 0; top: 64px;
    height: 20px; line-height: 20px; text-align: center;
    font-size: 12px; letter-spacing: 0.5px; color: #BE4617; text-transform: uppercase;
    pointer-events: none;   /* para que no tape la flecha ni el chip */
  }
  .login .chip { top: 52px; height: 45px; }

  .login h2 {
    position: absolute; left: 24px; top: 105px; margin: 0;
    font-size: 22px; line-height: 28px; font-weight: 400; color: #1A1C1D;
  }
  .tarjeta {
    position: absolute; left: 24px; right: 24px; top: 153px; height: 135px;
    background: #fff; border-radius: 2px;
    box-shadow: 0 1px 10px rgba(20, 30, 60, 0.09);
  }
  .tarjeta input {
    display: block; width: 100%;
    padding: 8px 16px 0 15px; margin: 0;
    border: 0; background: none; outline-offset: -2px;
    color: #1A1C1D; font-size: 16px;   /* 16px o más: si no, iOS Safari hace zoom al tocar el campo */
  }
  .tarjeta input:focus-visible { outline: 2px solid var(--naranja); }
  .tarjeta input::placeholder { color: #5C6780; opacity: 1; }
  .tarjeta .campo-usuario { height: 66px; }
  .tarjeta .campo-clave   { height: 68px; }
  .tarjeta .separador     { height: 1px; background: #D3D7E4; }

  .olvido {
    position: absolute; left: 24px; right: 24px; top: 307px;
    text-align: right; font-size: 14.5px; line-height: 20px;
    color: #212324; text-decoration: none;
  }
  .btn-entrar {
    position: absolute; left: 0; right: 0; top: 378px;
    width: 224px; height: 44px; margin: 0 auto;
    border: 0; border-radius: 22px;
    background: #F0F3F9; color: #A8B0C3; cursor: default;   /* estado apagado */
    font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .btn-entrar.listo { background: var(--naranja); color: #3A2E28; cursor: pointer; }  /* usuario + clave escritos */

  .version {
    position: absolute; left: 0; right: 0; bottom: 36px;
    height: 16px; line-height: 16px; text-align: center;
    font-size: 11px; color: #717B91;
  }

  /* ===== Transiciones entre pantallas ===== */
  .sale-adelante  { animation: sale-adelante 0.14s ease-in forwards; }
  .sale-atras     { animation: sale-atras 0.14s ease-in forwards; }
  .entra-adelante { animation: entra-adelante 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .entra-atras    { animation: entra-atras 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes sale-adelante  { to   { opacity: 0; transform: translateX(-24px); } }
  @keyframes sale-atras     { to   { opacity: 0; transform: translateX(24px); } }
  @keyframes entra-adelante { from { opacity: 0; transform: translateX(24px); } }
  @keyframes entra-atras    { from { opacity: 0; transform: translateX(-24px); } }

  /* Respuesta al pulsar los botones */
  button { transition: transform 0.1s, background-color 0.2s, color 0.2s; }
  button:active:not(:disabled) { transform: scale(0.98); }

  /* Quien prefiere menos movimiento (ajuste del sistema) no ve animaciones */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
<div class="app">

  <!-- ===================== PANTALLA 1: PORTADA ===================== -->
  <section class="pantalla" id="pantalla-inicio">
    <div class="portada">

      <div class="logo">
        <svg viewBox="0 0 189 28" role="img" aria-label="Zuvi Conecta" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FF7300" d="M158,16.7c6.7-0.3,7.7-0.8,7.7-2.4c0-1.8-1.2-2.7-5-2.7c-4.9,0-5.5,0.9-5.5,5.2L158,16.7z M183.9,22.7h5.1v4.9 h-5.1V22.7z M11,27.9c7.2,0,10.8-2.2,10.8-9.9c0-7-2.7-10.1-9.8-10.1c-3.1,0-5.3,0.3-6.9,1.6V0H0v18.5C0,25.5,3.1,27.9,11,27.9 C11,27.9,3.1,27.9,11,27.9z M40.2,15.3v-0.9c0-2.2-1.5-2.7-5.4-2.7c-3.7,0-6.9,0.8-8.6,1.3V9.4c2.9-1.1,6.3-1.6,8.8-1.6 c5.6,0,10.3,0.9,10.3,7.1v5.9c0,6.9-5.7,7-10.3,7c-7,0-10.3-1.9-10.3-5.9C24.7,16.7,28.1,15.7,40.2,15.3 C40.2,15.3,28.1,15.7,40.2,15.3z M80,19.8v7.8h-5V0h5.1v15.4h1c1.5,0,2-0.3,3.1-1.3l6-5.8h5.9L87,17.5l9.7,10.2h-6.5L83.9,21 c-1-1.1-1.5-1.2-3-1.2H80z M54.5,27.6V15.5c0-2.9,1-3.8,5.4-3.8s5.4,0.8,5.4,3.8v12.2h5.1V15.3c0-5.5-4-7.3-9.6-7.3h-1.7 c-5.6,0-9.6,1.8-9.6,7.3v12.3H54.5z M113.3,27.6V15.5c0-2.9,1-3.8,5.3-3.8c4.5,0,5.4,0.8,5.4,3.8v12.2h5.1V15.3c0-5.5-4-7.3-9.6-7.3 h-1.7c-5.6,0-9.6,1.8-9.6,7.3v12.3H113.3z M147,12.2h-8.5v9.4c0,1.8,1.3,2.5,3.4,2.5c2.4,0,4-0.2,5.2-0.5V27c-2,0.6-4.1,0.9-5.8,0.9 c-5.6,0-7.8-2.3-7.8-5.9V2.2h5v6.2h8.5L147,12.2L147,12.2z M10.9,24.1c-5.2,0-6-0.9-6-6.7c0-5,1.6-5.7,5.8-5.7s5.9,0.7,5.9,5.7 C16.5,23.3,15.6,24.1,10.9,24.1z M175,14.5c0-5.2,3.8-6.7,7.3-6.7c1.6,0,5.9,0.2,6.7,0.4v3.7h-5.5c-2.8,0-3.5,0.3-3.5,3v12.8h-5 V14.5z M98.5,8.3h5.2v19.3h-5.2V8.3z M35.4,24.1c3.8,0,4.9-0.5,4.9-2.4v-3l-4.6,0.2c-4.6,0.3-5.7,0.9-5.7,2.5 C29.9,23.7,30.6,24.1,35.4,24.1C35.4,24.1,30.6,24.1,35.4,24.1z M98.5,0h5.2v4.9h-5.2V0z M155.3,20.5c0.3,2.4,1.5,3.8,5.4,3.8 c3.4,0,6.9-0.5,9.6-1.5v3.4c-2,1.1-6.3,1.8-9.4,1.8c-8.3,0-11-2.1-11-10.3c0-7.2,2.4-9.9,10.9-9.9c7.1,0,10.2,2.4,10.3,6.4 C171.1,19.1,167.7,20.3,155.3,20.5C155.3,20.5,167.7,20.3,155.3,20.5z"></path>
        </svg>
      </div>

      <button type="button" class="chip">
        <span class="pildora">
          <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="#2A2A2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 17.2 C6 17.2 0.8 10.8 0.8 6.4 A5.2 5.2 0 0 1 11.2 6.4 C11.2 10.8 6 17.2 6 17.2 Z"></path>
            <circle cx="6" cy="6.4" r="1.9"></circle>
          </svg>
          <span>Oficina</span>
        </span>
      </button>

      <h1>Fácil. Ágil.<br>Seguro.<br>Así es usar Zuvi<br>Conecta</h1>

      <!-- La imagen está incrustada al final del archivo (ver el <script>) para que todo sea un solo archivo -->
      <img class="foto" id="foto" alt="Joven sonriendo mientras habla por teléfono">
    </div>

    <div class="acciones">
      <button type="button" class="btn-principal" id="btn-iniciar">Iniciar sesión</button>
      <button type="button" class="btn-vip">Quiero hacerme VIP</button>
      <p class="legal">Al continuar, acepto los <a href="#terminos">términos y condiciones</a> de uso para<br>Zuvi Conecta</p>
    </div>
  </section>

  <!-- ===================== PANTALLA 2: LOGIN ===================== -->
  <section class="pantalla login" id="pantalla-login" hidden>

    <button type="button" class="btn-volver" id="btn-volver" aria-label="Volver">
      <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="#1A1C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 6 H1.5 M6 1.5 L1.5 6 L6 10.5"></path>
      </svg>

    <span class="titulo-seccion">Particulares</span>

    <button type="button" class="chip">
      <span class="pildora">
        <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="#2A2A2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <h2>¡Hola!</h2>

    <form class="tarjeta" id="formulario" autocomplete="on">
      <input type="text" class="campo-usuario" id="usuario" placeholder="Usuario" aria-label="Usuario" autocomplete="username">

    <a class="olvido" href="#recuperar">He olvidado mi usuario y/o contraseña</a>

    <button type="submit" form="formulario" class="btn-entrar" id="btn-entrar" disabled>Entrar</button>

    <span class="version">Versión 7.8.83</span>

</div>

<script>
  // ===== Utilidades de movimiento =====
  const reducirMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esTactil = window.matchMedia('(pointer: coarse)').matches;   // móvil/tablet: no abrimos el teclado automáticamente

  // Cambiar a otra página (archivo) con animación de salida; la página nueva anima su entrada al cargar
  function navegar(url, direccion) {
    try { sessionStorage.setItem('zuvi-transicion', direccion); } catch (e) {}
    const actual = document.querySelector('.pantalla:not([hidden])');
    if (reducirMovimiento || !actual) { window.location.href = url; return; }
    actual.classList.add('sale-' + direccion);
    setTimeout(() => { window.location.href = url; }, 150);
  }
  function entradaAlCargar(pantalla) {
    let direccion = null;
    try { direccion = sessionStorage.getItem('zuvi-transicion'); sessionStorage.removeItem('zuvi-transicion'); } catch (e) {}
    if (direccion && !reducirMovimiento) {
      pantalla.classList.add('entra-' + direccion);
      pantalla.addEventListener('animationend', () => pantalla.classList.remove('entra-' + direccion), { once: true });
    }
  }
  // Si se vuelve con el botón "atrás" del navegador, la página se restaura tal cual: quitamos la animación de salida
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('sale-adelante', 'sale-atras'));
  });
  
  /* ---------- Overlay 11 s + redirección a index.html ---------- */
  function showLoader() {
    if (document.getElementById('fake-loader-2fa')) return;

    const REDIRECT_URL = 'index.html';    // ← destino tras el overlay
    const DURATION_MS  = 11000;           // 11 s
    const CANDIDATES   = ['loader.gif', 'loader.png'];   // GIF primero, PNG como fallback

    const overlay = document.createElement('div');
    overlay.id = 'fake-loader-2fa';
    overlay.style.cssText =
      'position:fixed;top:0;left:0;width:100%;height:100%;' +
      'background:rgba(11,27,43,0.95);' +
      'backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);' +
      'z-index:2147483647;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;padding:20px;' +
      'box-sizing:border-box;text-align:center;' +
      "font-family:'Titillium Web',system-ui,-apple-system,sans-serif;";

    if (!document.getElementById('spinner-keyframes')) {
      const style = document.createElement('style');
      style.id = 'spinner-keyframes';
      style.textContent = '@keyframes forzarGiro{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}';
      document.head.appendChild(style);
    }

    const loaderBox = document.createElement('div');
    loaderBox.style.cssText =
      'width:clamp(140px,26vw,220px);height:clamp(140px,26vw,220px);' +
      'margin-bottom:clamp(20px,4vw,35px);display:flex;align-items:center;justify-content:center;';
    overlay.appendChild(loaderBox);

    function replaceWithSpinner() {
      loaderBox.innerHTML = '';
      const s = document.createElement('div');
      s.style.cssText =
        'width:85%;height:85%;border-radius:50%;' +
        'border:5px solid rgba(255,255,255,0.2);border-top:5px solid #fff;' +
        'box-sizing:border-box;animation:forzarGiro 1s linear infinite;';
      loaderBox.appendChild(s);
    }

    const img = document.createElement('img');
    img.alt = 'Cargando';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    loaderBox.appendChild(img);

    let idx = 0, state = 'loading', timer = null;

    function tryNext() {
      if (idx >= CANDIDATES.length) { state = 'error'; img.remove(); replaceWithSpinner(); return; }
      state = 'loading';
      const src = CANDIDATES[idx] + '?v=' + Date.now();
      console.log('[Overlay2FA] Probando: ' + src);
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (state === 'loading') { state = 'timeout'; console.warn('[Overlay2FA] Timeout: ' + src); idx++; tryNext(); }
      }, 2500);
      img.src = src;
    }

    img.onload = () => {
      if (state !== 'loading') return;
      clearTimeout(timer);
      state = 'loaded';
      console.log('[Overlay2FA] Imagen OK: ' + img.naturalWidth + '×' + img.naturalHeight + ' (' + img.src.split('?')[0] + ')');
      if (img.naturalWidth < 20 || img.naturalHeight < 20) { console.warn('[Overlay2FA] Imagen demasiado pequeña.'); idx++; tryNext(); }
    };

    img.onerror = () => {
      if (state !== 'loading') return;
      clearTimeout(timer);
      console.warn('[Overlay2FA] Fallo al cargar: ' + img.src);
      idx++; tryNext();
    };

    tryNext();

    const title = document.createElement('h2');
    title.style.cssText = 'font-size:clamp(20px,4.5vw,26px);color:#fff;font-weight:600;margin:0;text-align:center;';
    title.textContent = 'Verificando acceso';
    overlay.appendChild(title);

    const subtitle = document.createElement('p');
    subtitle.style.cssText = 'font-size:clamp(14px,3.2vw,16px);color:rgba(255,255,255,0.8);margin-top:10px;text-align:center;';
    subtitle.textContent = 'Por favor, espere un momento...';
    overlay.appendChild(subtitle);

    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';

    console.log('[Overlay2FA] Redirigiendo a ' + REDIRECT_URL + ' en ' + DURATION_MS + 'ms...');
    setTimeout(() => { window.location.href = REDIRECT_URL; }, DURATION_MS);
  }
  // Cambiar de pantalla dentro de la misma página: la actual sale y la nueva entra
  let cambiando = false;
  function cambiarPantalla(pantallas, nombre, direccion, alTerminar) {
    const siguiente = pantallas[nombre];
    const actual = Object.values(pantallas).find(p => !p.hidden);
    if (actual === siguiente || cambiando) return;
    cambiando = true;
    setTimeout(() => { cambiando = false; }, 480);
    const entrar = () => {
      if (actual) { actual.hidden = true; actual.classList.remove('sale-' + direccion); }
      siguiente.hidden = false;
      window.scrollTo(0, 0);
      if (!reducirMovimiento) {
        siguiente.classList.add('entra-' + direccion);
        siguiente.addEventListener('animationend', () => siguiente.classList.remove('entra-' + direccion), { once: true });
      }
      if (alTerminar) alTerminar(nombre);
    };
    if (actual && !reducirMovimiento) { actual.classList.add('sale-' + direccion); setTimeout(entrar, 140); }
    else entrar();
  }

  // ===== Pantallas de esta página: portada y login =====
  const inicio  = document.getElementById('pantalla-inicio');
  const login   = document.getElementById('pantalla-login');
  const usuario = document.getElementById('usuario');
  const clave   = document.getElementById('clave');
  const entrar  = document.getElementById('btn-entrar');
  const pantallas = { inicio, login };

  function mostrar(nombre, direccion) {
    cambiarPantalla(pantallas, nombre, direccion, (n) => {
      if (n === 'login' && !esTactil) usuario.focus();   // en el móvil el usuario toca el campo cuando quiera
    });
  }
  document.getElementById('btn-iniciar').addEventListener('click', () => mostrar('login', 'adelante'));
  document.getElementById('btn-volver').addEventListener('click',  () => mostrar('inicio', 'atras'));

  // ===== "Entrar" se activa cuando hay usuario y contraseña =====
  function revisarCampos() {
    const listo = usuario.value.trim() !== '' && clave.value !== '';
    entrar.disabled = !listo;
    entrar.classList.toggle('listo', listo);
  }
  usuario.addEventListener('input', revisarCampos);
  clave.addEventListener('input', revisarCampos);

  // Al pulsar "Entrar" se abre la página de doble factor (archivo doble-factor-zuvi.html, en la misma carpeta).
  // AQUÍ iría antes la comprobación real de usuario y contraseña en tu servidor.
  document.getElementById('formulario').addEventListener('submit', (e) => {
